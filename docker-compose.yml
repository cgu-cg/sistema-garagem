services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: sistema-garagem-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: "America/Sao_Paulo"
    volumes:
      - ./apps/api/uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: sistema-garagem-web
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
